name: API Tests — play-qa.com

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag filter'
        required: false
        default: '@Run'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: |
          TAG="${{ github.event.inputs.tags || '@Run' }}"
          BASE_URL="${{ vars.BASE_URL || 'https://www.play-qa.com' }}"
          BASE_URL=$BASE_URL npx cucumber-js --tags "$TAG"

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results -o allure-report

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results
          retention-days: 30

      - name: Prepare deploy directory
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p deploy-root
          cp -r allure-report deploy-root/${{ github.run_number }}
          cp -r allure-report deploy-root/latest

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: deploy-root
          keep_files: true
